<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#87c3cc">
<title>Gratitude Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/meadow-spring.jpg">
<style>
  :root {
    --ink: #3a3a3a;
    --hand: 'Shadows Into Light', 'Bradley Hand', 'Segoe Print', cursive;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --ph: clamp(34px, 4.3vh, 52px);
    --pw: clamp(300px, 37.3vw, 760px);
    --dw: clamp(22px, 2.1vw, 34px);
    --dh: var(--dw);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87c3cc; transition: background .8s; }
  body { -webkit-font-smoothing: antialiased; }
  #scene, #grass, #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #scene, #grass { pointer-events: none; }
  #fx { touch-action: manipulation; }
  .ui { position: fixed; inset: 0; pointer-events: none; }

  /* splash: two solid panels that part in the middle once the garden is ready */
  #splash { position: fixed; inset: 0; z-index: 20; }
  #splash i { position: absolute; top: 0; bottom: 0; width: 50.2%; background: #87c3cc; transition: transform .9s cubic-bezier(.7, 0, .3, 1); }
  #splash i:first-child { left: 0; } #splash i:last-child { right: 0; }
  #splash.open { pointer-events: none; }
  #splash.open i:first-child { transform: translateX(-101%); } #splash.open i:last-child { transform: translateX(101%); }
  @media (prefers-reduced-motion: reduce) { #splash i { transition: opacity .4s; } #splash.open i { transform: none; opacity: 0; } }

  /* gratitude input */
  .pill {
    position: absolute; left: 50%; top: calc(35.8vh - var(--ph) / 2);
    width: var(--pw); height: var(--ph); transform: translateX(-50%);
    pointer-events: auto; margin: 0;
  }
  .pill input {
    position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box;
    border: 0; border-radius: 999px; outline: 0; margin: 0;
    background: rgba(255, 255, 255, .3);
    font-family: var(--hand); font-size: 16px; color: var(--ink);
    padding: 0 1.1em; caret-color: var(--ink);
  }
  .pill input::placeholder { color: #6b6b6b; opacity: 1; transition: opacity .3s; }
  .pill input:focus::placeholder { opacity: .6; }

  /* top-right icon menus: season + backup */
  .tools { position: absolute; top: calc(2.8vh - var(--dh) / 2); right: calc(6vw - var(--dw) / 2); display: flex; gap: max(12px, calc(2vw - var(--dw))); pointer-events: auto; }
  .menu { position: relative; }
  .menu-btn {
    width: 24px; height: 24px; padding: 0; border: 0; cursor: pointer; background: none;
    display: grid; place-items: center; color: var(--ink);
    filter: drop-shadow(0 0 1.2px rgba(255,255,255,.9)) drop-shadow(0 1px 2px rgba(40,60,80,.35));
    opacity: .85; transition: transform .4s cubic-bezier(.3,.7,.3,1), opacity .3s;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-btn:hover, .menu-btn[aria-expanded="true"] { opacity: 1; transform: scale(1.1) rotate(-4deg); }
  .menu-btn svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .menu-btn:focus-visible, .menu-item:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
  .menu-list {
    position: absolute; top: calc(100% + 10px); right: 0; min-width: 9.5em; margin: 0; padding: .3em;
    background: rgba(244, 242, 233, .9); border: 1.5px solid var(--ink);
    border-radius: 18px 12px 20px 12px / 12px 20px 12px 18px;
    opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .25s, transform .25s, visibility 0s .25s;
  }
  .menu.open .menu-list { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .menu-item {
    display: flex; align-items: center; gap: .6em; width: 100%; box-sizing: border-box; padding: .15em .6em .2em .4em;
    border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left;
    font: 16px/1.2 var(--hand); color: var(--ink); letter-spacing: .03em; white-space: nowrap;
  }
  .menu-item:hover { background: rgba(58, 58, 58, .09); }
  .menu-item[aria-checked="true"] { background: rgba(58, 58, 58, .13); }
  .menu-item svg { width: 24px; height: 24px; flex: none; overflow: visible; }
  .menu-item .ico-line { stroke: var(--ink); }
  .menu-item[data-season="winter"] g[stroke] { stroke: #7fa6c4; }
  .toast {
    position: absolute; top: calc(2.8vh + var(--dh) / 2 + 8px); right: calc(6vw - var(--dw) / 2); max-width: 70vw; text-align: right;
    font: 20px/1.1 var(--hand); color: var(--ink); opacity: 0; transition: opacity .4s; pointer-events: none;
    text-shadow: 0 0 6px rgba(255,255,255,.8);
  }
  .toast.show { opacity: .95; }

  /* note shown when hovering a gratitude flower */
  .note {
    position: absolute; left: 0; top: 0; max-width: min(320px, 72vw); box-sizing: border-box;
    padding: .3em .85em .4em; font: 16px/1.1 var(--hand); color: var(--ink); letter-spacing: .03em;
    background: rgba(244, 242, 233, .84); border: 1.5px solid var(--ink);
    border-radius: 255px 16px 225px 16px / 16px 225px 16px 255px;
    opacity: 0; transform: translate(-50%, calc(-100% + 4px)); transition: opacity .35s, transform .35s;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note small { display: block; font-size: 14px; opacity: .65; margin-top: .1em; }
  .note.show { opacity: 1; transform: translate(-50%, -100%); }

  .drift { position: absolute; font-family: var(--hand); color: var(--ink); white-space: pre; pointer-events: none; }
  .drift span { display: inline-block; white-space: pre; }

  #diag { position: fixed; left: 10px; bottom: 10px; z-index: 5; max-width: min(520px, 90vw); padding: 6px 10px; border-radius: 8px; background: rgba(30,30,30,.78); color: #fff; font: 12px/1.4 var(--sans); pointer-events: none; display: none; white-space: pre-wrap; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (max-width: 700px) {
    :root { --pw: 86vw; }
    .pill input { font-size: 16px; padding-left: .9em; padding-right: .9em; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="grass" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="splash" aria-hidden="true"><i></i><i></i></div>
<div id="diag"></div>
<div class="ui" id="ui">
  <form class="pill" id="pill" autocomplete="off">
    <input id="gratitude" type="text" maxlength="120" enterkeyhint="done"
           placeholder="What are you grateful for today?" aria-label="What are you grateful for today?">
    <button type="submit" class="sr-only">Plant</button>
  </form>

  <div class="tools">
    <div class="menu" id="seasonMenu">
      <button class="menu-btn" id="seasonBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Season"></button>
      <div class="menu-list" role="menu" aria-label="Season">
      <button class="menu-item" role="menuitemradio" data-season="spring" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(12 12)"><g fill="#f4a6cf" stroke="#d9709f" stroke-width=".7"><ellipse cx="0" cy="-5.2" rx="3.6" ry="4.6" transform="rotate(0)"/><ellipse cx="0" cy="-5.2" rx="3.6" ry="4.6" transform="rotate(72)"/><ellipse cx="0" cy="-5.2" rx="3.6" ry="4.6" transform="rotate(144)"/><ellipse cx="0" cy="-5.2" rx="3.6" ry="4.6" transform="rotate(216)"/><ellipse cx="0" cy="-5.2" rx="3.6" ry="4.6" transform="rotate(288)"/></g><circle r="2.3" fill="#ffd95a" stroke="#e0a82e" stroke-width=".6"/></g></svg>Spring</button>
      <button class="menu-item" role="menuitemradio" data-season="summer" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(12 12)"><g stroke="#f7a823" stroke-width="1.8" stroke-linecap="round"><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(0)"/><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(45)"/><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(90)"/><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(135)"/><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(180)"/><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(225)"/><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(270)"/><line x1="0" y1="-7.6" x2="0" y2="-10.6" transform="rotate(315)"/></g><circle r="5.4" fill="#ffd54a" stroke="#f2a31c" stroke-width=".8"/></g></svg>Summer</button>
      <button class="menu-item" role="menuitemradio" data-season="autumn" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5C18.5 6 20 12 12 20.5 4 12 5.5 6 12 2.5Z" fill="#e8742a" stroke="#b84a16" stroke-width=".9"/><path d="M12 7v15M12 11l-3-2.6M12 14l3.4-3M12 16.6l-2.6-2" fill="none" stroke="#b84a16" stroke-width=".9"/></g></svg>Autumn</button>
      <button class="menu-item" role="menuitemradio" data-season="winter" aria-checked="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(12 12)" stroke="#fff" stroke-width="1.7" stroke-linecap="round" fill="none"><g transform="rotate(0)"><line x1="0" y1="0" x2="0" y2="-9.5"/><polyline points="-2.6,-7.4 0,-5.2 2.6,-7.4"/></g><g transform="rotate(60)"><line x1="0" y1="0" x2="0" y2="-9.5"/><polyline points="-2.6,-7.4 0,-5.2 2.6,-7.4"/></g><g transform="rotate(120)"><line x1="0" y1="0" x2="0" y2="-9.5"/><polyline points="-2.6,-7.4 0,-5.2 2.6,-7.4"/></g><g transform="rotate(180)"><line x1="0" y1="0" x2="0" y2="-9.5"/><polyline points="-2.6,-7.4 0,-5.2 2.6,-7.4"/></g><g transform="rotate(240)"><line x1="0" y1="0" x2="0" y2="-9.5"/><polyline points="-2.6,-7.4 0,-5.2 2.6,-7.4"/></g><g transform="rotate(300)"><line x1="0" y1="0" x2="0" y2="-9.5"/><polyline points="-2.6,-7.4 0,-5.2 2.6,-7.4"/></g></g></svg>Winter</button>
      </div>
    </div>
    <div class="menu" id="backupMenu">
      <button class="menu-btn" id="backupBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Save or load your gratitudes">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><path class="ico-line" stroke="#fff" stroke-width="3.4" d="M12 3v10M7.5 9 12 13.5 16.5 9M4.5 15v4.5h15V15"/><path class="ico-line" stroke="currentColor" d="M12 3v10M7.5 9 12 13.5 16.5 9M4.5 15v4.5h15V15"/></svg>
      </button>
      <div class="menu-list" role="menu" aria-label="Backup">
        <button class="menu-item" role="menuitem" id="exportBtn"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><path class="ico-line" d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 15v4.5h15V15"/></svg>Save my garden</button>
        <button class="menu-item" role="menuitem" id="importBtn"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"><path class="ico-line" d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4.5 15v4.5h15V15"/></svg>Load a garden</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <div class="note" id="note" role="tooltip"></div>
  <div class="sr-only" aria-live="polite" id="live"></div>
  <ul class="sr-only" id="list" aria-label="Your gratitudes"></ul>
</div>

<script src="assets/flowers.js"></script>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Seasons — each one is a recoloured copy of the painted meadow
 *  (assets/meadow-<season>.jpg). The painting stays still; grass blades
 *  and flowers are drawn on a WebGL layer above it.
 * ------------------------------------------------------------------ */
const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
const SEASON = {
  spring: { sky: '#74b8e4', particles: 'petals' },
  summer: { sky: '#69b2e6', particles: 'motes' },
  autumn: { sky: '#86b4d2', particles: 'leaves' },
  winter: { sky: '#a6c4d8', particles: 'snow' }
};
// painted sky per season: [top, middle, horizon] gradient, cloud highlight, cloud shadow, cloud count
const SKY = {
  spring: { g: ['#74b8e4', '#a9d6f0', '#dcf0f6'], hi: '#ffffff', sh: '#a9c6e0', n: 5 },
  summer: { g: ['#69b2e6', '#a0d2f2', '#d6eef8'], hi: '#ffffff', sh: '#a2c3e4', n: 4 },
  autumn: { g: ['#86b4d2', '#bdd5e0', '#f0e6d2'], hi: '#fff8ec', sh: '#b8c0cc', n: 3 },
  winter: { g: ['#a6c4d8', '#cbdde8', '#eaf1f2'], hi: '#ffffff', sh: '#b4c6d6', n: 0 }
};
// grass palette sampled from grass.png, per season and distance band: [deep, dark, mid, light, sunlit]
const PALETTE = {
  spring: { far: ['#3f8a3a', '#499640', '#60aa40', '#9fd934', '#d0ea3a'], mid: ['#2f6a3e', '#479245', '#71b842', '#a5d445', '#d4ec44'], near: ['#1e5325', '#2d7233', '#35843a', '#70b64b', '#94cb54'] },
  summer: { far: ['#56912f', '#609c33', '#78ae37', '#b4d73b', '#dce74b'], mid: ['#43752f', '#5e9936', '#89ba3a', '#b8d445', '#e0e953'], near: ['#31601e', '#437b29', '#4d8b2e', '#88b93f', '#aacd49'] },
  autumn: { far: ['#8b6928', '#98742c', '#b18731', '#dbb446', '#edd069'], mid: ['#705322', '#95712c', '#c09537', '#dcb449', '#efd46f'], near: ['#58431a', '#725621', '#826226', '#c09438', '#d4ab46'] },
  winter: { far: ['#99adb1', '#a7babb', '#becfcd', '#dfeade', '#f0f5e5'], mid: ['#7f929a', '#a4b7ba', '#ccdbd6', '#e0eadf', '#f2f7e7'], near: ['#687a81', '#82969c', '#91a6ab', '#cbdbd7', '#dae6de'] }
};
const FLOWER_TINT = ['#ef8fc4', '#f6f4ea', '#9466cc'];   // colour of the seed that drifts down
// flowers from the reference painting: [x, y (image fractions), sprite, size multiplier, tilt]
const PAINTED = [];   // none: only flowers attached to an entry are drawn

/* ------------------------------------------------------------------ *
 *  Utilities
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1) - 1; return 1 + 2.4 * t * t * t + 1.4 * t * t; };
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgba = (h, a = 1) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const loadImg = src => new Promise(res => { if (!src) return res(null); const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });

function spline(pts) {
  const n = pts.length, m = pts.map((_, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    return (b[1] - a[1]) / (b[0] - a[0]);
  });
  return fx => {
    if (fx <= pts[0][0]) return pts[0][1];
    if (fx >= pts[n - 1][0]) return pts[n - 1][1];
    let i = 1; while (fx > pts[i][0]) i++;
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], h = x1 - x0, t = (fx - x0) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * h * m[i - 1] + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * h * m[i];
  };
}
// hill skyline, traced from grass.png (image fractions)
const skyline = spline([[0, .4453], [.025, .4473], [.05, .4453], [.075, .4375], [.1, .4375], [.125, .4414], [.15, .4453], [.175, .4492], [.2, .457], [.225, .4668], [.25, .4707], [.275, .4629], [.3, .459], [.325, .4551], [.35, .4551], [.4, .4551], [.425, .457], [.45, .459], [.475, .4629], [.5, .4707], [.525, .4785], [.55, .4844], [.575, .4805], [.6, .4707], [.625, .4609], [.65, .4531], [.675, .4453], [.7, .4375], [.725, .4336], [.75, .4297], [.775, .4238], [.85, .4238], [.875, .4258], [.9, .4277], [.925, .4316], [.95, .4336], [.975, .4414], [1, .4531]]);
// top of the sunlit foreground meadow, where the yellow band of grass runs (image fractions)
const groundTop = spline([[-.04, .50], [.15, .51], [.30, .54], [.45, .58], [.60, .63], [.75, .67], [.90, .70], [1.04, .72]]);
// 0 at the horizon, 1 at the bottom of the painting: blades and flowers are sized by this
const persp = fy => clamp((fy - .42) / .58, 0, 1);
const flowerSize = fy => IH * (.014 + .05 * Math.pow(persp(fy), .9));

/* ------------------------------------------------------------------ *
 *  State
 * ------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
const FROZEN = params.has('still');
// on-screen status: always shown if the grass layer fails, or with ?debug
const diag = document.getElementById('diag');
const showDiag = msg => { openSplash(); diag.textContent = msg; diag.style.display = 'block'; };
window.addEventListener('error', e => showDiag('Script error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')));
window.addEventListener('unhandledrejection', e => showDiag('Error: ' + (e.reason && e.reason.message || e.reason)));
const STORE = 'gratitude-garden:v1';
const state = (() => {
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.entries)) return s; } catch (e) {}
  return { season: 'spring', entries: [] };
})();
if (!SEASON[state.season]) state.season = 'spring';
if (SEASON[params.get('season')]) state.season = params.get('season');
const save = () => { if (params.has('demo')) return; try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

// three stacked layers: the painting (2D), grass + flowers (WebGL), seeds + particles (2D)
const canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
const grassCv = document.getElementById('grass');
const fxCv = document.getElementById('fx'), fx = fxCv.getContext('2d');
const staticCv = document.createElement('canvas'), sctx = staticCv.getContext('2d');   // hills, transparent above the skyline
const skyCv = document.createElement('canvas'), kctx = skyCv.getContext('2d');          // sky backdrop
let fadeCv = null, fadeStart = 0, sceneDirty = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

// the painting covers the window like background-size: cover (IW x IH at OX, OY)
let W = 0, H = 0, DPR = 1, IW = 1, IH = 1, OX = 0, OY = 0, U = 1, AREA = 1, quality = 1, ready = false;
const X = fx => OX + fx * IW, Y = fy => OY + fy * IH;
let flowerHits = [], seeds = [], particles = [], SPRITES = [];
const growing = new Map();   // entry id -> start time of its growth animation

/* ------------------------------------------------------------------ *
 *  Painting layer (baked once per size / season)
 * ------------------------------------------------------------------ */
const SIMG = {}, pending = {};
// a painted sky, in two pieces drawn at the painting's size: the backdrop (gradient + brush marks)
// and a tile of clouds that wraps horizontally so it can drift in a loop
function paintSky(name, w, h) {
  const P = SKY[name], R = mulberry32(5 + name.length * 31), ch = Math.floor(h * .5);
  const mk = (cw, chh) => { const cv = document.createElement('canvas'); cv.width = cw; cv.height = chh; return cv; };
  const mix = (a, b, k) => { const x = hexRgb(a), y = hexRgb(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * k))})`; };
  const stroke = (c, x, y, len, wid, col, al, bend) => {
    c.globalAlpha = al; c.strokeStyle = col; c.lineWidth = wid; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + len / 2, y + bend, x + len, y + bend * .3); c.stroke();
  };
  // backdrop
  const sky = mk(w, ch), sc = sky.getContext('2d');
  const g = sc.createLinearGradient(0, 0, 0, ch * .94);
  g.addColorStop(0, P.g[0]); g.addColorStop(.55, P.g[1]); g.addColorStop(1, P.g[2]);
  sc.fillStyle = g; sc.fillRect(0, 0, w, ch);
  sc.globalAlpha = 1;
  // clouds
  const clouds = document.createElement('canvas'); clouds.width = w; clouds.height = ch;
  const c = clouds.getContext('2d');

  const text = input.value.replace(/\s+/g, ' ').trim();
  if (!text || !ready) { input.focus(); return; }
  const r = dissolve(input.value);
  input.value = '';
  plant(text, { from: r });
  save(); renderList();
  live.textContent = `Planted a flower for: ${text}`;
});
input.addEventListener('keydown', ev => { if (ev.key === 'Escape') input.blur(); });

/* hover / tap a flower to read it */
const note = document.getElementById('note');
let noteFor = null;
function hitTest(x, y) {
  let best = null, bd = 1e9;
  for (const h of flowerHits) { const d = Math.hypot(h.x - x, h.y - y); if (d < h.r && d < bd) { bd = d; best = h; } }
  return best;
}
function showNote(h) {
  if (!h) { note.classList.remove('show'); noteFor = null; fxCv.style.cursor = ''; return; }
  fxCv.style.cursor = 'pointer';
  if (noteFor !== h.e) {
    noteFor = h.e; note.textContent = h.e.text;
    const sm = document.createElement('small');
    sm.textContent = new Date(h.e.ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    note.appendChild(sm);
  }
  const nx = clamp(h.x, 170, W - 170);
  note.style.left = Math.max(8, Math.min(W - 8, nx)) + 'px'; note.style.top = (h.y - h.r * .9) + 'px';
  note.classList.add('show');
}
fxCv.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse') showNote(hitTest(ev.clientX, ev.clientY)); });
fxCv.addEventListener('pointerleave', () => showNote(null));
fxCv.addEventListener('pointerdown', ev => { if (ev.pointerType !== 'mouse') showNote(hitTest(ev.clientX, ev.clientY)); });

function openSplash() { const sp = document.getElementById('splash'); if (!sp) return; sp.classList.add('open'); setTimeout(() => sp.remove(), 1200); }
setTimeout(openSplash, 8000);   // never trap the visitor behind it

/* ------------------------------------------------------------------ *
 *  Start
 * ------------------------------------------------------------------ */
setSeason(state.season, false);
palA = palB = flatPal(state.season);
Promise.all([loadSeason(state.season), Promise.all((window.FLOWER_SPRITES || []).map(loadImg))]).then(([, flowers]) => {
  initGL(); buildAtlas(flowers.filter(Boolean)); ready = true;
  layout();
  if (params.has('demo')) {
    const samples = ['morning light through the window', 'a long call with my sister', 'warm coffee', 'the walk home', 'finishing the sketch', 'my friends', 'rain on the roof', 'a good book', 'kind words from a stranger', 'fresh bread'];
    for (let i = 0; i < (+params.get('demo') || 8); i++) plant(samples[i % samples.length], { instant: true });
  }
  renderList();
  requestAnimationFrame(frame);
  setTimeout(openSplash, Math.max(0, 600 - performance.now()));
  // fetch the other seasons in the background so switching is instant
  setTimeout(() => SEASONS.forEach(loadSeason), 1200);
});
if (matchMedia('(hover: hover) and (pointer: fine)').matches) setTimeout(() => input.focus({ preventScroll: true }), 400);
})();
</script>
