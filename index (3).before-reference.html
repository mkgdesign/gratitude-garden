<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c3c5c4">
<title>Gratitude Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3a3a3a;
    --hand: 'Reenie Beanie', 'Bradley Hand', 'Segoe Print', cursive;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --ph: clamp(34px, 4.3vh, 52px);
    --pw: clamp(300px, 37.3vw, 760px);
    --dw: clamp(13px, 1.45vw, 24px);
    --dh: calc(var(--dw) * 1.18);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c3c5c4; }
  body { -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: manipulation; }
  .ui { position: fixed; inset: 0; pointer-events: none; }

  /* gratitude input */
  .pill {
    position: absolute; left: 50%; top: calc(35.8vh - var(--ph) / 2);
    width: var(--pw); height: var(--ph); transform: translateX(-50%);
    pointer-events: auto; margin: 0;
  }
  .pill input {
    position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box;
    border: 0; border-radius: 999px; outline: 0; margin: 0;
    background: rgba(255, 255, 255, .3);
    font-family: var(--sans); font-size: calc(var(--ph) * .36); color: var(--ink);
    padding: 0 1.1em; caret-color: var(--ink);
  }
  .pill input::placeholder { color: #6b6b6b; opacity: 1; transition: opacity .3s; }
  .pill input:focus::placeholder { opacity: .6; }

  /* season dots */
  .seasons {
    position: absolute; top: calc(2.8vh - var(--dh) / 2); right: calc(6vw - var(--dw) / 2);
    display: flex; gap: max(9px, calc(2.4vw - var(--dw))); pointer-events: auto;
  }
  .dot {
    width: var(--dw); height: var(--dh); padding: 0; border: 0; cursor: pointer;
    border-radius: 52% 48% 50% 50% / 58% 52% 48% 42%;
    background: radial-gradient(ellipse at 48% 46%, #f1b2be 0%, #f4c5cd 38%, #f8dfe3 66%, rgba(252,240,242,.9) 84%, rgba(252,240,242,0) 100%);
    opacity: .78; transform: rotate(var(--r, 0deg)) scale(.92);
    transition: transform .5s cubic-bezier(.3,.7,.3,1), opacity .5s, background .5s;
    -webkit-tap-highlight-color: transparent;
  }
  .dot:hover { opacity: .95; }
  .dot[aria-pressed="true"] {
    opacity: 1; transform: rotate(var(--r, 0deg)) scale(1.1);
    background: radial-gradient(ellipse at 48% 46%, #eb93a4 0%, #f0abb8 42%, #f6d3da 72%, rgba(249,232,235,.8) 88%, rgba(249,232,235,0) 100%);
  }
  .dot:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 50%; }
  .season-label {
    position: absolute; top: calc(2.8vh + var(--dh) / 2 + 6px); right: calc(6vw - var(--dw) / 2);
    font: 21px/1 var(--hand); color: var(--ink); opacity: 0; transition: opacity .4s; letter-spacing: .05em;
  }
  .season-label.show { opacity: .85; }

  /* note shown when hovering a gratitude flower */
  .note {
    position: absolute; left: 0; top: 0; max-width: min(320px, 72vw); box-sizing: border-box;
    padding: .3em .85em .4em; font: 23px/1.1 var(--hand); color: var(--ink); letter-spacing: .03em;
    background: rgba(244, 242, 233, .84); border: 1.5px solid var(--ink);
    border-radius: 255px 16px 225px 16px / 16px 225px 16px 255px;
    opacity: 0; transform: translate(-50%, calc(-100% + 4px)); transition: opacity .35s, transform .35s;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note small { display: block; font-size: .72em; opacity: .65; margin-top: .1em; }
  .note.show { opacity: 1; transform: translate(-50%, -100%); }

  .drift { position: absolute; font-family: var(--hand); color: var(--ink); white-space: pre; pointer-events: none; }
  .drift span { display: inline-block; white-space: pre; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (max-width: 700px) {
    :root { --pw: 86vw; }
    .pill input { font-size: max(16px, min(calc(var(--ph) * .36), 4.2vw)); padding-left: .9em; padding-right: .9em; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="ui" id="ui">
  <form class="pill" id="pill" autocomplete="off">
    <input id="gratitude" type="text" maxlength="120" enterkeyhint="done"
           placeholder="What are you grateful for today?" aria-label="What are you grateful for today?">
    <button type="submit" class="sr-only">Plant</button>
  </form>

  <div class="seasons" role="group" aria-label="Season">
    <button class="dot" data-season="spring" aria-label="Spring" style="--r:-4deg"></button>
    <button class="dot" data-season="summer" aria-label="Summer" style="--r:6deg"></button>
    <button class="dot" data-season="autumn" aria-label="Autumn" style="--r:-8deg"></button>
    <button class="dot" data-season="winter" aria-label="Winter" style="--r:10deg"></button>
  </div>
  <div class="season-label" id="seasonLabel" aria-hidden="true"></div>

  <div class="note" id="note" role="tooltip"></div>
  <div class="sr-only" aria-live="polite" id="live"></div>
  <ul class="sr-only" id="list" aria-label="Your gratitudes"></ul>
</div>

/* ------------------------------------------------------------------ *
 *  Composition — traced from the original painting, in fractions of a

 * ------------------------------------------------------------------ */
function spline(pts) {
  const n = pts.length, m = pts.map((_, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    return (b[1] - a[1]) / (b[0] - a[0]);
  });
  const f = fx => {
    if (fx <= pts[0][0]) return pts[0][1] + m[0] * (fx - pts[0][0]);
    if (fx >= pts[n - 1][0]) return pts[n - 1][1] + m[n - 1] * (fx - pts[n - 1][0]);
    let i = 1; while (fx > pts[i][0]) i++;
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], h = x1 - x0, t = (fx - x0) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * h * m[i - 1] + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * h * m[i];
  };
  f.x0 = pts[0][0]; f.x1 = pts[n - 1][0];
  return f;
}

/* ------------------------------------------------------------------ *
 *  Frame loop

  VW = Math.max(W, H * .95); OX = (VW - W) / 2;
  U = H / 600; CS = (VW / H) / (4 / 3); AREA = (W * H) / (1440 * 900);
  for (const cv of [canvas, staticCv]) { cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
  gen(); bake();
}
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 140); });

/* ------------------------------------------------------------------ *
 *  Seasons
 * ------------------------------------------------------------------ */
const dots = [...document.querySelectorAll('.dot')], label = document.getElementById('seasonLabel');
let labelTimer = 0;
function showLabel(name, ms) {
  label.textContent = name; label.classList.add('show');
  clearTimeout(labelTimer); if (ms) labelTimer = setTimeout(() => label.classList.remove('show'), ms);
}
function setSeason(name, animate) {
  if (!PAL[name]) return;
  if (animate && W) {
    fadeCv = fadeCv || document.createElement('canvas');
    fadeCv.width = canvas.width; fadeCv.height = canvas.height;
    fadeCv.getContext('2d').drawImage(canvas, 0, 0); fadeStart = performance.now();
  }
  state.season = name; P = PAL[name];
  document.body.style.background = P.bg; document.querySelector('meta[name=theme-color]').content = P.bg;
  dots.forEach(d => d.setAttribute('aria-pressed', String(d.dataset.season === name)));
  particles = [];
  if (W) bake();
}
dots.forEach(d => {
  d.addEventListener('click', () => { if (state.season !== d.dataset.season) { setSeason(d.dataset.season, true); save(); } showLabel(d.dataset.season, 1400); });
  d.addEventListener('mouseenter', () => showLabel(d.dataset.season));
  d.addEventListener('focus', () => showLabel(d.dataset.season));
  d.addEventListener('mouseleave', () => showLabel(state.season, 10));
  d.addEventListener('blur', () => label.classList.remove('show'));
});

/* ------------------------------------------------------------------ *
 *  Planting gratitudes
 * ------------------------------------------------------------------ */
const input = document.getElementById('gratitude'), live = document.getElementById('live'), list = document.getElementById('list');
const ui = document.getElementById('ui');
function pickSpot() {
  const others = state.entries.map(flowerPos).concat(PAINTED.map(([fx, fy]) => ({ x: X(fx), y: Y(fy) })));
  let best = null, bestScore = -1;
  for (let i = 0; i < 36; i++) {
    const cand = { fx: .04 + Math.random() * .92, d: .03 + Math.pow(Math.random(), 1.15) * .88 };
    const p = flowerPos(cand);
    let md = 1e9; for (const o of others) md = Math.min(md, Math.hypot(o.x - p.x, (o.y - p.y) * 1.4));
    const score = Math.min(md, H * .22) + Math.random() * H * .02;
    if (score > bestScore) { bestScore = score; best = cand; }
  }
  return best;
}
function renderList() {
  list.innerHTML = '';
  for (const e of state.entries) { const li = document.createElement('li'); li.textContent = `${e.text} (${new Date(e.ts).toLocaleDateString()})`; list.appendChild(li); }
}
function dissolve(text) {
  const r = input.getBoundingClientRect(), cs = getComputedStyle(input);
  const wrap = document.createElement('div'); wrap.className = 'drift';
  Object.assign(wrap.style, { left: r.left + parseFloat(cs.paddingLeft) + 'px', top: r.top + 'px', height: r.height + 'px', lineHeight: r.height + 'px', fontFamily: cs.fontFamily, fontSize: cs.fontSize, letterSpacing: cs.letterSpacing, paddingTop: cs.paddingTop });
  for (const ch of text) { const s = document.createElement('span'); s.textContent = ch; wrap.appendChild(s); }
  ui.appendChild(wrap);
  if (reduceMotion.matches) { wrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }); }
  else [...wrap.children].forEach((s, i) => s.animate([
    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
    { transform: `translate(${30 + Math.random() * 70}px, ${-16 - Math.random() * 42}px) rotate(${(Math.random() - .3) * 50}deg)`, opacity: 0 }
  ], { duration: 1500 + Math.random() * 700, delay: i * 16 + Math.random() * 140, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' }));
  setTimeout(() => wrap.remove(), 3400);
  return r;
}
function plant(text, opts = {}) {
  const spot = pickSpot();
  const e = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, ts: Date.now(), fx: +spot.fx.toFixed(4), d: +spot.d.toFixed(4), seed: (Math.random() * 1e6) | 0 };
  state.entries.push(e);
  if (state.entries.length > 400) state.entries.splice(0, state.entries.length - 400);
  if (!opts.instant) {
    const now = performance.now(), r = opts.from, p = flowerPos(e);
    const dur = reduceMotion.matches ? 0 : 1600;
    if (dur) seeds.push({ x0: r.left + r.width * .5, y0: r.bottom - 4, x1: p.x, y1: p.y, cx: (r.left + r.width * .5 + p.x) / 2 + W * .12, cy: Math.min(r.bottom, p.y) - H * .05, t0: now, dur, color: P.grow[e.seed % P.grow.length].p });
    growing.set(e.id, now + dur);
  }
  return e;
}
pillEl.addEventListener('submit', ev => {
  ev.preventDefault();
  const text = input.value.replace(/\s+/g, ' ').trim();
  if (!text) { input.focus(); return; }
  const r = dissolve(input.value);
  input.value = '';
  plant(text, { from: r });
  save(); renderList();
  live.textContent = `Planted a flower for: ${text}`;
});
input.addEventListener('keydown', ev => { if (ev.key === 'Escape') input.blur(); });

/* hover / tap a flower to read it */
const note = document.getElementById('note');
let noteFor = null;
function hitTest(x, y) {
  let best = null, bd = 1e9;
  for (const h of flowerHits) { const d = Math.hypot(h.x - x, h.y - y); if (d < h.r && d < bd) { bd = d; best = h; } }
  return best;
}
function showNote(h) {
  if (!h) { note.classList.remove('show'); noteFor = null; canvas.style.cursor = ''; return; }
  canvas.style.cursor = 'pointer';
  if (noteFor !== h.e) {
    noteFor = h.e; note.textContent = h.e.text;
    const sm = document.createElement('small');
    sm.textContent = new Date(h.e.ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    note.appendChild(sm);
  }
  const nx = clamp(h.x, 170, W - 170);
  note.style.left = Math.max(8, Math.min(W - 8, nx)) + 'px'; note.style.top = (h.y - h.r * .9) + 'px';
  note.classList.add('show');
}
canvas.addEventListener('pointermove', ev => { if (ev.pointerType === 'mouse') showNote(hitTest(ev.clientX, ev.clientY)); });
canvas.addEventListener('pointerleave', () => showNote(null));
canvas.addEventListener('pointerdown', ev => { if (ev.pointerType !== 'mouse') showNote(hitTest(ev.clientX, ev.clientY)); });

/* ------------------------------------------------------------------ *
 *  Start
 * ------------------------------------------------------------------ */
setSeason(state.season, false);
layout();
if (params.has('demo')) {
  const samples = ['morning light through the window', 'a long call with my sister', 'warm coffee', 'the walk home', 'finishing the sketch', 'my friends', 'rain on the roof', 'a good book', 'kind words from a stranger', 'fresh bread'];
  for (let i = 0; i < (+params.get('demo') || 8); i++) plant(samples[i % samples.length], { instant: true });
}
renderList();
requestAnimationFrame(frame);
if (matchMedia('(hover: hover) and (pointer: fine)').matches) setTimeout(() => input.focus({ preventScroll: true }), 400);
})();
</script>
</body>
</html>
